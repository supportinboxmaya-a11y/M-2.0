version: '3.8'

# Maya 2.0 ULTRA - Docker Compose for ARM64
# Run: docker-compose -f docker-compose.yml up -d

services:
  # Main Maya application
  maya:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm64
    image: maya-2.0-ultra:latest
    container_name: maya-ultra
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"  # Direct API access (optional)
    volumes:
      - maya-storage:/opt/maya/storage
      - maya-logs:/opt/maya/logs
      - maya-workspace:/opt/maya/workspace
      - maya-backups:/opt/maya/backups
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker
    environment:
      - TZ=UTC
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - maya-network

  # Qdrant Vector Database (optional, alternative to ChromaDB)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: maya-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - maya-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: maya-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - maya-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: maya-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - maya-network

  # Node Exporter for host metrics
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: maya-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: "host"
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'
    networks:
      - maya-network

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: maya-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - maya-network

volumes:
  maya-storage:
  maya-logs:
  maya-workspace:
  maya-backups:
  qdrant-storage:
  prometheus-data:
  grafana-data:

networks:
  maya-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16