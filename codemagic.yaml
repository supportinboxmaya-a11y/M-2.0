workflows:
  android-release:
    name: Maya Pro Native Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          else
            cd $(find . -name "pubspec.yaml" -exec dirname {} \;)
            flutter pub get
          fi
      - name: Build Android Release APK
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            cd $(find . -name "pubspec.yaml" -exec dirname {} \;)
          fi
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/app-release.apk"