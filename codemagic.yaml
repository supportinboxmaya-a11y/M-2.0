workflows:
  android-release:
    name: Maya Pro Native Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd maya_flutter
          flutter pub get
      - name: Build Android Release APK
        script: |
          cd maya_flutter
          flutter build apk --release
    artifacts:
      - maya_flutter/build/app/outputs/flutter-apk/*.apk