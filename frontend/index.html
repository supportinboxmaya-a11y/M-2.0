<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Maya 2.0 ULTRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--surface:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--cyan:#39d2c0;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.3);--sidebar-w:240px}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
body{display:flex;min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font:inherit;border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;background:var(--surface);color:var(--text);transition:all .15s}
button:hover{background:var(--bg3);border-color:var(--text2)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent2);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent)}
button.danger{background:#7d1a1a;border-color:var(--red);color:#fff}
button.danger:hover{background:var(--red)}
input,textarea,select{font:inherit;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);width:100%;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:13px}
::placeholder{color:var(--text2)}
/* ── Layout ── */
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:16px;color:var(--accent)}
.sidebar-header span{font-size:11px;color:var(--text2)}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--text2);font-size:13px;transition:all .1s;text-decoration:none}
.sidebar-nav a:hover,.sidebar-nav a.active{color:var(--text);background:var(--bg3);text-decoration:none}
.sidebar-nav a .icon{width:18px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)}
.main{flex:1;margin-left:var(--sidebar-w);padding:24px;min-height:100vh;max-width:calc(100vw - var(--sidebar-w))}
.page{display:none;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin-bottom:8px;font-size:15px;color:var(--text)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.stat{text-align:center;padding:16px}
.stat-value{font-size:28px;font-weight:700;color:var(--accent)}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}
/* ── Tables ── */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:var(--bg3);color:var(--text2);font-weight:600;position:sticky;top:0}
tr:hover{background:var(--bg3)}
/* ── Tags / Badges ── */
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.tag-done,.tag-success{background:#0d3d1a;color:var(--green)}
.tag-failed,.tag-error{background:#3d0d0d;color:var(--red)}
.tag-running,.tag-pending{background:#1a2d3d;color:var(--accent)}
.tag-disabled{background:#1d1d1d;color:var(--text2)}
.tag-env{background:#2d1a3d;color:var(--purple)}
/* ── Forms ── */
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:4px;font-size:12px;color:var(--text2);font-weight:600}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-row>*{flex:1;min-width:200px}
/* ── Modal ── */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto}
.modal h2{margin-bottom:16px;font-size:18px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* ── Toast ── */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:13px;animation:slideIn .3s ease;max-width:400px;box-shadow:var(--shadow)}
.toast-info{background:#1a2d3d;border:1px solid var(--accent);color:var(--accent)}
.toast-success{background:#0d3d1a;border:1px solid var(--green);color:var(--green)}
.toast-error{background:#3d0d0d;border:1px solid var(--red);color:var(--red)}
.toast-warning{background:#2d1a0d;border:1px solid var(--orange);color:var(--orange)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* ── Misc ── */
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.gap-sm{gap:4px}
.mt-sm{margin-top:8px}
.mt-md{margin-top:16px}
.mb-sm{margin-bottom:8px}
.mb-md{margin-bottom:16px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.text-sm{font-size:12px;color:var(--text2)}
.text-mono{font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:13px}
.empty{text-align:center;padding:40px;color:var(--text2)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.pointer{cursor:pointer}
/* ── Login ── */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;margin-left:0}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:40px;width:400px;max-width:90%}
.login-box h1{font-size:24px;margin-bottom:4px}
.login-box p{color:var(--text2);margin-bottom:24px;font-size:13px}
.login-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border)}
.login-tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:10px;border-bottom:2px solid transparent;color:var(--text2)}
.login-tabs button.active{border-bottom-color:var(--accent);color:var(--text)}
/* ── Responsive ── */
@media(max-width:768px){.sidebar{width:60px}.sidebar-header h1,.sidebar-header span,.sidebar-nav a span,.sidebar-footer{display:none}.sidebar-nav a{justify-content:center;padding:12px}.main{margin-left:60px;padding:16px;max-width:calc(100vw - 60px)}.card-grid{grid-template-columns:1fr}.form-row>*{min-width:100%}}
/* ── Code blocks ── */
pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow-x:auto;font-family:'SF Mono','Fira Code',monospace;font-size:12px;white-space:pre-wrap}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px;font-family:'SF Mono','Fira Code',monospace}
/* ── Progress ── */
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>🧠 Maya</h1>
    <span>2.0 ULTRA</span>
  </div>
  <div class="sidebar-nav" id="nav"></div>
  <div class="sidebar-footer" id="sidebarUser"></div>
</nav>

<!-- Main Content -->
<main class="main" id="main"></main>

<!-- Toast Container -->
<div class="toast-container" id="toasts"></div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/hardware.js"></script>
<script src="js/app.js"></script>
</body>
</html>
