<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="description" content="Maya 2.0 — Autonomous AI Agent">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maya AI">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Maya AI">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">

<title>Maya 2.0</title>
</head>
<body>

<div class="app-shell" id="app">

  <!-- ═══ TOP BAR ═══ -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="topbar-btn" id="sidebarToggle" title="Toggle sidebar">☰</button>
      <span class="topbar-brand">Maya AI</span>
    </div>
    <div class="topbar-center">
      <div class="topbar-search">
        <span>🔍</span>
        <input type="text" id="globalSearch" placeholder="Search anything..." aria-label="Global search">
      </div>
      <select class="topbar-model" id="modelSelector" aria-label="Select AI model">
        <option>Claude 5</option>
        <option>GPT-5.4</option>
        <option>Gemini 3.6</option>
        <option>DeepSeek V4</option>
      </select>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn notif-btn" id="notifBtn" title="Notifications">
        🔔
        <span class="notif-badge hidden" id="notifBadge">0</span>
      </button>
      <div class="user-avatar" id="userAvatar" title="User menu">M</div>
    </div>
  </header>

  <!-- ═══ BODY (sidebar + workspace + right panel) ═══ -->
  <div class="app-body">

    <!-- Sidebar (desktop) -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-section" id="primaryNav"></div>
      <div class="sidebar-separator"></div>
      <div class="sidebar-section" id="secondaryNav"></div>
      <div class="sidebar-separator"></div>
      <div class="sidebar-section" id="tertiaryNav"></div>
      <div style="flex:1"></div>
      <div class="sidebar-separator"></div>
      <div class="sidebar-section">
        <button class="sidebar-item" id="userMenuItem">
          <span class="sidebar-item-icon">👤</span>
          <span id="userNameLabel">User</span>
        </button>
      </div>
    </nav>

    <!-- Main workspace -->
    <main class="workspace" id="workspace">
      <div class="workspace-content" id="workspaceContent">
        <div class="loading-screen" id="loadingScreen">
          <span class="spinner spinner-lg"></span>
          <span>Loading...</span>
        </div>
      </div>
    </main>

    <!-- Right panel (desktop context) -->
    <aside class="right-panel" id="rightPanel">
      <div id="rightPanelContent"></div>
    </aside>

  </div>

  <!-- ═══ BOTTOM BAR (mobile) ═══ -->
  <nav class="bottombar" id="bottombar"></nav>

  <!-- ═══ STATUS BAR ═══ -->
  <div class="statusbar" id="statusbar">
    <span class="connection-dot online" id="connDot"></span>
    <span id="connLabel">Connected</span>
    <span id="taskCountLabel" style="flex:1;text-align:center"></span>
    <span id="costLabel"></span>
  </div>

</div>

<!-- ═══ OVERLAYS ═══ -->

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<!-- Toast container -->
<div class="toast-container" id="toasts"></div>

<!-- Side drawer (mobile: history, file tree) -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer"><div id="drawerContent"></div></div>

<!-- Bottom sheet (mobile: overflow) -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheetContent"></div></div>

<script>
// Safety timeout: if app.js never runs, kill the loading spinner after 8s
(function() {
  var ws = document.getElementById('workspaceContent');
  if (!ws) return;
  setTimeout(function() {
    // If still showing loading screen, replace it
    if (ws.querySelector('.loading-screen') || ws.textContent.trim() === '') {
      ws.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;min-height:80vh;flex-direction:column;gap:12px;padding:24px;color:#8b949e">' +
        '<div style="font-size:40px">🧠</div>' +
        '<h1 style="font-size:24px;color:#e6edf3;margin:0">Maya 2.0</h1>' +
        '<p>Could not load the application. Check your connection.</p>' +
        '<button onclick="location.reload()" style="padding:8px 24px;cursor:pointer;border:1px solid #30363d;border-radius:8px;background:#1f6feb;color:#fff;font:inherit;font-size:14px">Retry</button></div>';
    }
  }, 8000);
})();
</script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/hardware.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(reg) {
    console.log('SW registered:', reg.scope);
  }).catch(function(err) {
    console.log('SW registration failed:', err);
  });
}
</script>
</body>
</html>
