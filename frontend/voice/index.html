<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Maya Voice - Voice-controlled AI assistant">
  <meta name="theme-color" content="#8b6f47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maya Voice">
  <title>Maya Voice</title>
  <link rel="manifest" href="/voice/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --fg: #1a1a1a;
      --accent: #8b6f47;
      --accent-hover: #7a5e3a;
      --card: #ffffff;
      --border: #e8e4dc;
      --muted: #6b6b6b;
      --danger: #c0392b;
      --success: #27ae60;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #f5f5f5;
        --accent: #c9a876;
        --accent-hover: #d4b884;
        --card: #1e1e1e;
        --border: #333;
        --muted: #999;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      overflow-x: hidden;
    }
    .container { width: 100%; max-width: 420px; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 28px; font-weight: 600; color: var(--fg); }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    .status-indicator {
      width: 16px; height: 16px; border-radius: 50%;
      margin: 0 auto 16px;
      transition: all 0.3s ease;
    }
    .status-indicator.idle { background: var(--muted); }
    .status-indicator.connecting { background: var(--accent); animation: pulse 1.5s infinite; }
    .status-indicator.listening { background: var(--success); animation: pulse 0.8s infinite; }
    .status-indicator.thinking { background: var(--accent); animation: pulse 1s infinite; }
    .status-indicator.speaking { background: #e67e22; animation: pulse 0.6s infinite; }
    .status-indicator.error { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
    .status-text { font-size: 16px; font-weight: 500; min-height: 24px; }
    .status-detail { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 20px; }
    .ptt-button {
      width: 160px; height: 160px; border-radius: 50%;
      border: none; background: var(--accent);
      color: white; font-size: 18px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto; cursor: pointer;
      box-shadow: 0 8px 32px rgba(139, 111, 71, 0.3);
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .ptt-button:active, .ptt-button.recording {
      background: var(--danger);
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(192, 57, 43, 0.4);
    }
    .ptt-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .ptt-button .icon { font-size: 48px; margin-bottom: 8px; }
    .ptt-button .label { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .ptt-button .hint { font-size: 11px; opacity: 0.8; margin-top: 4px; }
    .transcript-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 24px;
      min-height: 120px;
      font-size: 14px;
      line-height: 1.6;
    }
    .transcript-area.empty { color: var(--muted); font-style: italic; }
    .transcript-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .transcript-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .transcript-label { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .transcript-text { color: var(--fg); }
    .transcript-text.user { color: var(--accent); }
    .transcript-text.maya { color: var(--fg); }
    .controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .connection-status { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; }
    .install-banner {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      display: flex; align-items: center; gap: 12px; z-index: 100;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .install-banner.hidden { display: none; }
    @media (max-width: 480px) {
      .ptt-button { width: 140px; height: 140px; }
      .ptt-button .icon { font-size: 40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Maya Voice</h1>
      <p class="subtitle">Push to talk • Release to send</p>
    </header>

    <div class="status-card">
      <div class="status-indicator idle" id="statusIndicator"></div>
      <div class="status-text" id="statusText">Disconnected</div>
      <div class="status-detail" id="statusDetail">Tap connect to start</div>
    </div>

    <button class="ptt-button" id="pttButton" disabled aria-label="Push to talk">
      <span class="icon" id="pttIcon">🎤</span>
      <span class="label" id="pttLabel">Connect</span>
      <span class="hint" id="pttHint">Hold to record</span>
    </button>

    <div class="controls">
      <button class="btn btn-primary" id="connectBtn" onclick="connect()">Connect</button>
      <button class="btn btn-secondary" id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
      <button class="btn btn-secondary" id="clearBtn" onclick="clearTranscript()">Clear</button>
    </div>

    <div class="transcript-area empty" id="transcriptArea">
      <div style="text-align: center; color: var(--muted);">Conversation will appear here</div>
    </div>

    <div class="connection-status" id="connectionStatus"></div>
  </div>

  <div class="install-banner hidden" id="installBanner">
    <span>Install Maya Voice for offline access</span>
    <button class="btn btn-primary" id="installBtn">Install</button>
    <button class="btn btn-secondary" onclick="document.getElementById('installBanner').classList.add('hidden')">Later</button>
  </div>

  <script type="module" src="/voice/app.js"></script>
</body>
</html>
