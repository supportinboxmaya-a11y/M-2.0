<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Brain icon (stylized) -->
  <g transform="translate(256,256)" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M-60,-80 C-100,-80 -120,-40 -100,0 C-120,40 -100,80 -60,80"/>
    <!-- Right hemisphere -->
    <path d="M60,-80 C100,-80 120,-40 100,0 C120,40 100,80 60,80"/>
    <!-- Center divide -->
    <path d="M0,-80 L0,80" stroke-width="12"/>
    <!-- Neural connections left -->
    <path d="M-80,-40 C-40,-30 -60,0 -80,20"/>
    <path d="M-70,40 C-40,50 -50,70 -70,80"/>
    <path d="M-60,-60 C-30,-50 -40,-20 -60,-10"/>
    <!-- Neural connections right -->
    <path d="M80,-40 C40,-30 60,0 80,20"/>
    <path d="M70,40 C40,50 50,70 70,80"/>
    <path d="M60,-60 C30,-50 40,-20 60,-10"/>
    <!-- Bottom stem -->
    <path d="M-20,80 C-20,120 20,120 20,80"/>
  </g>
  <!-- "M" letter overlay -->
  <text x="256" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="120" fill="#fff" opacity="0.3">M</text>
</svg>
