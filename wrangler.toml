name = "maya-ai"
main = "worker/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "Maya 2.0 ULTRA"
BACKEND_URL = "http://130.210.46.182:8000"

# D1 Database (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "maya-db"
database_id = "be7b286b-3d55-4d03-a7a6-c64782434650"

# R2 Storage (Files & Backups)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "maya-storage"

# KV Store (Short-term memory & Cache)
[[kv_namespaces]]
binding = "CACHE"
id = "4ea5e4d4d4e54ef3a91983c8cee6fc92"

[[kv_namespaces]]
binding = "MEMORY"
id = "4ea5e4d4d4e54ef3a91983c8cee6fc92"

# AI Gateway (optional)
[ai]
binding = "AI"

# Routes
[[routes]]
pattern = "maya.your-domain.com/*"
zone_name = "your-domain.com"

[triggers]
crons = ["0 * * * *"]

[build]
command = "npm install"

[dev]
port = 8787
local_protocol = "http"
