name: Android Release Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  packages: write

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '35.0.0'
          ndk-version: r26c
          cmdline-tools-version: 'latest'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Create keystore from secrets
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/maya-release.keystore
          echo "storepass=${{ secrets.KEYSTORE_PASSWORD }}" > local.properties
          echo "keypass=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "keyalias=${{ secrets.KEY_ALIAS }}" >> local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          cd MayaApp
          ./gradlew assembleRelease --no-daemon --parallel

      - name: Verify APK
        run: |
          APK_PATH="MayaApp/app/build/outputs/apk/release/app-release.apk"
          echo "APK size: $(du -h $APK_PATH | cut -f1)"
          echo "APK path: $APK_PATH"

      - name: Sign APK (if unsigned)
        if: github.event_name != 'pull_request'
        run: |
          APK_PATH="MayaApp/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK_PATH" || \
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks app/keystore/maya-release.keystore \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --out app-release-signed.apk \
              "$APK_PATH"
            cp app-release-signed.apk app-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-app-release
          path: |
            MayaApp/app/build/outputs/apk/release/app-release.apk
            MayaApp/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MayaApp/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Commit and Push APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          APK_PATH="MayaApp/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            git add "$APK_PATH"
            git commit -m "chore: update release APK [skip ci]" || echo "No changes to commit"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.build.result }}"
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "$STATUS" = "success" ]; then
            echo "✅ Build succeeded: $RUN_URL"
          else
            echo "❌ Build failed: $RUN_URL"
          fi