name: Build Maya Voice APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME
          echo "Build tools:"
          ls -la $ANDROID_HOME/build-tools/
          echo "Platforms:"
          ls -la $ANDROID_HOME/platforms/

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle wrapper validation
        run: ./gradlew wrapper --gradle-version 8.11.1

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Find ALL APKs
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f | while read f; do echo "Found: $f"; ls -lh "$f"; done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-voice-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-voice-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
