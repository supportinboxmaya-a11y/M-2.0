name: Build Maya APK (Native Android)

on:
  push:
    branches: [main]
    paths:
      - 'MayaApp/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Set up keystore
        run: |
          mkdir -p MayaApp/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > MayaApp/keystore/maya-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        working-directory: MayaApp
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Find APK
        run: |
          find MayaApp -name "*.apk" -exec ls -lh {} \;

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-assistant-apk
          path: MayaApp/app/build/outputs/apk/release/*.apk
          retention-days: 30
