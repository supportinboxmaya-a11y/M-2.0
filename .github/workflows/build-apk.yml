name: Build Maya APK (Full SPA)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Create Bubblewrap config
        run: |
          JDK_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          cat > bubblewrap-config.json << EOC
          {
            "manifest": "https://supportinboxmaya-a11y.github.io/M-2.0/manifest.json",
            "directory": "twa-output",
            "name": "Maya Assistant",
            "packageName": "com.maya.assistant",
            "androidSdkPath": "/usr/local/lib/android/sdk",
            "jdkPath": "${JDK_PATH}",
            "autoGrantPermissions": true,
            "signingKey": {
              "path": "twa-output/release.keystore",
              "alias": "android"
            }
          }
          EOC
          cat bubblewrap-config.json

      - name: Initialize TWA project
        run: |
          echo "y" | bubblewrap init --config=bubblewrap-config.json || true
          # If init prompts, create the project structure manually
          if [ ! -d "twa-output" ]; then
            mkdir -p twa-output
            cat > twa-output/twa-manifest.json << 'EOM'
            {
              "host": "supportinboxmaya-a11y.github.io",
              "startUrl": "/M-2.0/",
              "name": "Maya Assistant",
              "launcherName": "Maya Assistant",
              "packageId": "com.maya.assistant",
              "appVersionCode": 1,
              "appVersionName": "1.0.0",
              "display": "standalone",
              "orientation": "portrait-primary",
              "themeColor": "#8b6f47",
              "backgroundColor": "#faf9f6",
              "iconUrl": "https://supportinboxmaya-a11y.github.io/M-2.0/assets/icon-512.png",
              "maskableIconUrl": "https://supportinboxmaya-a11y.github.io/M-2.0/assets/icon-512.png",
              "shortcuts": [],
              "features": {
                "playBilling": { "enabled": false },
                "locationDelegation": { "enabled": false }
              },
              "signingKey": {
                "path": "twa-output/release.keystore",
                "alias": "android"
              },
              "generatorApp": "bubblewrap"
            }
            EOM
          fi

      - name: Build APK
        run: |
          cd twa-output
          echo "y" | bubblewrap build --config=../bubblewrap-config.json || true

      - name: Find APK
        run: |
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-assistant-apk
          path: |
            twa-output/app/build/outputs/apk/release/*.apk
            twa-output/**/*.apk
          retention-days: 30
