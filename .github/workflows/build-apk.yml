name: Build Maya Voice APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: List project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== App directory ==="
          ls -la app/
          echo "=== App src ==="
          find app/src -type f | head -30

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find app/build -name "*.apk" -o -name "*.aab" 2>/dev/null | xargs ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-voice-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.aab
          retention-days: 30
