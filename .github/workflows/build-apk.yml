name: Build Maya APK (Full SPA)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Generate Bubblewrap config
        run: |
          node << 'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          
          // Find JDK path
          const javaHome = process.env.JAVA_HOME || '/usr/lib/jvm/temurin-17-jdk-amd64';
          const jdkPath = javaHome;
          
          const config = {
            manifest: "https://supportinboxmaya-a11y.github.io/M-2.0/manifest.json",
            directory: "twa-output",
            name: "Maya Assistant",
            packageName: "com.maya.assistant",
            androidSdkPath: "/usr/local/lib/android/sdk",
            jdkPath: jdkPath,
            autoGrantPermissions: true,
            signingKey: {
              path: "twa-output/release.keystore",
              alias: "android"
            }
          };
          
          fs.writeFileSync('bubblewrap-config.json', JSON.stringify(config, null, 2));
          console.log('Config written:', JSON.stringify(config, null, 2));
          
          // Create twa-manifest.json
          const twaManifest = {
            host: "supportinboxmaya-a11y.github.io",
            startUrl: "/M-2.0/",
            name: "Maya Assistant",
            launcherName: "Maya Assistant",
            packageId: "com.maya.assistant",
            appVersionCode: 1,
            appVersionName: "1.0.0",
            display: "standalone",
            orientation: "portrait-primary",
            themeColor: "#8b6f47",
            backgroundColor: "#faf9f6",
            iconUrl: "https://supportinboxmaya-a11y.github.io/M-2.0/assets/icon-512.png",
            maskableIconUrl: "https://supportinboxmaya-a11y.github.io/M-2.0/assets/icon-512.png",
            shortcuts: [],
            features: {
              playBilling: { enabled: false },
              locationDelegation: { enabled: false }
            },
            signingKey: {
              path: "twa-output/release.keystore",
              alias: "android"
            },
            generatorApp: "bubblewrap"
          };
          
          if (!fs.existsSync('twa-output')) {
            fs.mkdirSync('twa-output', { recursive: true });
          }
          fs.writeFileSync('twa-output/twa-manifest.json', JSON.stringify(twaManifest, null, 2));
          console.log('twa-manifest.json written');
          NODEEOF

      - name: Initialize TWA project
        run: |
          echo "y" | bubblewrap init --config=bubblewrap-config.json || true

      - name: Build APK
        run: |
          cd twa-output
          echo "y" | bubblewrap build --config=../bubblewrap-config.json || true

      - name: Find APK
        run: |
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-assistant-apk
          path: |
            twa-output/app/build/outputs/apk/release/*.apk
            twa-output/**/*.apk
          retention-days: 30
