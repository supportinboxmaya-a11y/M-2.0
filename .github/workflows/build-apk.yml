name: Build Maya APK (Full SPA)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Configure Bubblewrap
        run: |
          bubblewrap updateConfig --jdkPath=$(dirname $(dirname $(readlink -f $(which java)))) --androidSdkPath=$ANDROID_HOME

      - name: Initialize TWA project
        run: |
          bubblewrap init \
            --manifest=https://supportinboxmaya-a11y.github.io/M-2.0/manifest.json \
            --directory=twa-output \
            --name="Maya Assistant" \
            --packageName=com.maya.assistant \
            --autoGrantPermissions

      - name: Build APK
        run: |
          cd twa-output
          bubblewrap build

      - name: Find APK
        run: |
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-assistant-apk
          path: |
            twa-output/app/build/outputs/apk/release/*.apk
            twa-output/**/*.apk
          retention-days: 30
