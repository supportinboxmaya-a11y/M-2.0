# Maya 2.0 ULTRA - Supervisor Configuration
# Manages all Maya services

[supervisord]
nodaemon=true
logfile=/opt/maya/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
user=maya

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/opt/maya/logs/nginx.stdout.log
stderr_logfile=/opt/maya/logs/nginx.stderr.log
priority=10

[program:maya-api]
command=/opt/venv/bin/python api.py
directory=/opt/maya
user=maya
autostart=true
autorestart=true
stdout_logfile=/opt/maya/logs/maya-api.stdout.log
stderr_logfile=/opt/maya/logs/maya-api.stderr.log
environment=PYTHONPATH="/opt/maya",STORAGE_DIR="/opt/maya/storage",WORKSPACE_DIR="/opt/maya/workspace"
priority=20
startsecs=10
stopwaitsecs=30

[program:redis]
command=redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
user=redis
autostart=true
autorestart=true
stdout_logfile=/opt/maya/logs/redis.stdout.log
stderr_logfile=/opt/maya/logs/redis.stderr.log
priority=5

[program:chromadb]
command=chroma run --host 0.0.0.0 --port 8000 --path /opt/maya/storage/vector_store/chroma
user=maya
autostart=true
autorestart=true
stdout_logfile=/opt/maya/logs/chromadb.stdout.log
stderr_logfile=/opt/maya/logs/chromadb.stderr.log
priority=15
startsecs=5

[group:maya-services]
programs=nginx,maya-api,redis,chromadb