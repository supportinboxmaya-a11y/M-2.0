services:
  - type: web
    name: maya-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
